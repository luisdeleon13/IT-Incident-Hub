# Pipeline de integracion continua - IT Incident Hub
trigger:
  branches:
    include:
      - main
      - feature/*
      - fix/*
      - docs/*

pool:
  name: Default

steps:
  # 1. Checkout del codigo
  - checkout: self

  
  - script: npm ci
    workingDirectory: backend
    displayName: 'Instalar dependencias del backend'

    # Revision de dependencias de produccion (falla con severidad alta o critica)
  - script: npm audit --omit=dev --audit-level=high
    workingDirectory: backend
    displayName: 'Auditoria de dependencias del backend (produccion)'

    # Pruebas automaticas del backend (Jest)
  - script: npm test
    workingDirectory: backend
    displayName: 'Pruebas del backend (Jest)'

  # 3. Instalar dependencias del frontend
  - script: npm ci
    workingDirectory: frontend
    displayName: 'Instalar dependencias del frontend'

  # 4. Build del frontend
  - script: npm run build
    workingDirectory: frontend
    displayName: 'Build del frontend'