# Pipeline de integracion continua - IT Incident Hub
trigger:
  branches:
    include:
      - main
      - feature/*
      - fix/*
      - docs/*

pool:
  name: Default
variables:
  - group: incident-hub-secretos
steps:
  # 1. Checkout del codigo
  - checkout: self

  
  - script: npm ci
    workingDirectory: backend
    displayName: 'Instalar dependencias del backend'

    # Revision de dependencias de produccion (falla con severidad alta o critica)
  - script: npm audit --omit=dev --audit-level=high
    workingDirectory: backend
    displayName: 'Auditoria de dependencias del backend (produccion)'

    # Pruebas automaticas del backend (Jest)
  - script: npm test
    workingDirectory: backend
    displayName: 'Pruebas del backend (Jest)'

  # 3. Instalar dependencias del frontend
  - script: npm ci
    workingDirectory: frontend
    displayName: 'Instalar dependencias del frontend'

  # 4. Build del frontend
  - script: npm run build
    workingDirectory: frontend
    displayName: 'Build del frontend'

  # Demostracion de uso de un secreto protegido (Azure oculta su valor en los logs)
  - powershell: |
      if ($env:DB_PASSWORD) { Write-Host "DB_PASSWORD disponible (longitud: $($env:DB_PASSWORD.Length))" }
      else { Write-Host "DB_PASSWORD no disponible"; exit 1 }
    displayName: 'Verificar secreto protegido'
    env:
      DB_PASSWORD: $(DB_PASSWORD)
  # Preparar la carpeta del paquete: backend (sin node_modules ni .env) y frontend compilado
  - powershell: |
      New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)\paquete" | Out-Null
      robocopy backend "$(Build.ArtifactStagingDirectory)\paquete\backend" /E /XD node_modules /XF .env | Out-Null
      robocopy frontend\dist "$(Build.ArtifactStagingDirectory)\paquete\frontend" /E | Out-Null
      robocopy database "$(Build.ArtifactStagingDirectory)\paquete\database" /E | Out-Null
      if ($LASTEXITCODE -ge 8) { exit 1 } else { exit 0 }
    displayName: 'Preparar paquete'

  # Comprimir el paquete en un .zip
  - task: ArchiveFiles@2
    displayName: 'Comprimir paquete'
    inputs:
      rootFolderOrFile: '$(Build.ArtifactStagingDirectory)\paquete'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)\incident-hub-$(Build.BuildNumber).zip'

  # Publicar el .zip como artefacto
  - task: PublishBuildArtifacts@1
    displayName: 'Publicar artefacto'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)\incident-hub-$(Build.BuildNumber).zip'
      ArtifactName: 'incident-hub'
