# Pipeline IT Incident Hub: Build -> Dev -> QA -> Produccion
trigger:
  branches:
    include:
      - main
      - feature/*
      - fix/*
      - docs/*
      - refactor/*

variables:
  - group: incident-hub-secretos

stages:
  - stage: Build
    displayName: 'Build, pruebas y empaquetado'
    pool:
      name: Default
    jobs:
      - job: build
        steps:
          - checkout: self

          - script: npm ci
            workingDirectory: backend
            displayName: 'Instalar dependencias del backend'

          # Falla con severidad alta o critica en dependencias de produccion
          - script: npm audit --omit=dev --audit-level=high
            workingDirectory: backend
            displayName: 'Auditoria de dependencias del backend (produccion)'

          - script: npm test
            workingDirectory: backend
            displayName: 'Pruebas del backend (Jest)'

          - script: npm ci
            workingDirectory: frontend
            displayName: 'Instalar dependencias del frontend'

          - script: npm run build
            workingDirectory: frontend
            displayName: 'Build del frontend'

          # El secreto se mapea explicitamente; solo se imprime su longitud
          - powershell: |
              if ($env:DB_PASSWORD) { Write-Host "DB_PASSWORD disponible (longitud: $($env:DB_PASSWORD.Length))" }
              else { Write-Host "DB_PASSWORD no disponible"; exit 1 }
            displayName: 'Verificar secreto protegido'
            env:
              DB_PASSWORD: $(DB_PASSWORD)

          # Paquete: backend (sin node_modules ni .env), frontend compilado y scripts SQL
          - powershell: |
              New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)\paquete" | Out-Null
              $destinos = @(
                @{ origen = "backend";       destino = "backend"  },
                @{ origen = "frontend\dist"; destino = "frontend" },
                @{ origen = "database";      destino = "database" }
              )
              foreach ($d in $destinos) {
                $dest = "$(Build.ArtifactStagingDirectory)\paquete\$($d.destino)"
                if ($d.origen -eq "backend") {
                  robocopy $d.origen $dest /E /XD node_modules /XF .env .env.local | Out-Null
                } else {
                  robocopy $d.origen $dest /E | Out-Null
                }
                # robocopy usa codigos 0-7 para exito; 8 o mas es error
                if ($LASTEXITCODE -ge 8) { Write-Host "Fallo al copiar $($d.origen)"; exit 1 }
              }
              exit 0
            displayName: 'Preparar paquete'

          - task: ArchiveFiles@2
            displayName: 'Comprimir paquete'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)\paquete'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)\incident-hub-$(Build.BuildNumber).zip'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar artefacto'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)\incident-hub-$(Build.BuildNumber).zip'
              ArtifactName: 'incident-hub'

  - stage: Dev
    displayName: 'Despliegue en Dev'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    pool:
      name: Default
    jobs:
      - deployment: desplegar_dev
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: dir "$(Pipeline.Workspace)\incident-hub"
                  displayName: 'Artefacto recibido en Dev'

  - stage: QA
    displayName: 'Validacion en QA'
    dependsOn: Dev
    condition: succeeded()
    pool:
      name: Default
    jobs:
      - deployment: validar_qa
        environment: qa
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo Validacion en QA del artefacto incident-hub
                  displayName: 'Validar en QA'

  - stage: Produccion
    displayName: 'Liberacion a Produccion'
    dependsOn: QA
    condition: succeeded()
    pool:
      name: Default
    jobs:
      - deployment: liberar_produccion
        environment: produccion
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo Liberando incident-hub a Produccion
                  displayName: 'Liberar a Produccion'